<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="sidenav"
  >
    <div class="sidenav-inner">
      <a routerLink="/app" class="sidenav-logo" (click)="isHandset() && sidenav.close()">
        <img src="/logo_horizontal.png" alt="ChliJob." class="logo-img" />
      </a>
      <p class="sidenav-tagline">{{ 'APP.TAGLINE' | translate }}</p>

      <mat-divider />

      <mat-nav-list class="nav-list">
        @for (item of navItems; track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: item.route === '/app' }"
            (click)="isHandset() && sidenav.close()"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.labelKey | translate }}</span>
          </a>
        }
      </mat-nav-list>

      <div class="sidenav-spacer"></div>

      <a routerLink="/app/profile" class="user-card" (click)="isHandset() && sidenav.close()">
        <app-user-avatar [avatarUrl]="auth.avatarUrl()" [initials]="auth.initials()" [size]="36" />
        <div class="user-info">
          <span class="user-name">{{ auth.fullName() }}</span>
          <span class="user-role">
            {{
              auth.profile()?.preferred_role === 'giver'
                ? ('PROFILE.ROLE_GIVER' | translate)
                : ('PROFILE.ROLE_TAKER' | translate)
            }}
          </span>
        </div>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="sidenav.open()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-spacer"></span>
      <a routerLink="/app/profile" class="toolbar-user-btn" aria-label="User account">
        <app-user-avatar [avatarUrl]="auth.avatarUrl()" [initials]="auth.initials()" [size]="36" />
      </a>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
