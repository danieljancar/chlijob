<mat-accordion [multi]="multi()">
  @for (item of items(); track item.title) {
    <mat-expansion-panel [expanded]="item.expanded ?? false">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ item.title | translate }}</mat-panel-title>
        @if (item.subtitle) {
          <mat-panel-description>{{ item.subtitle | translate }}</mat-panel-description>
        }
      </mat-expansion-panel-header>
      <p>{{ item.description | translate }}</p>
    </mat-expansion-panel>
  }
</mat-accordion>
