<mat-accordion>
    @for(item of items; track item) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title> {{item.title}} </mat-panel-title>
          <mat-panel-description> {{item.subtitle}} </mat-panel-description>
        </mat-expansion-panel-header>
        <p>{{item.description}}</p>
      </mat-expansion-panel>
    }
</mat-accordion>
