<div class="hero">
  <div class="hero-content">
    <h1 class="hero-title">{{ 'HOME.HERO_TITLE' | translate }}</h1>
    <p class="hero-subtitle">{{ 'HOME.HERO_SUBTITLE' | translate }}</p>
    <div class="hero-actions">
      @if (auth.isAuthenticated()) {
        <a routerLink="/app" mat-flat-button class="hero-cta-primary">
          {{ 'NAV.TO_APP' | translate }}
        </a>
      } @else {
        <a routerLink="/auth/register" mat-flat-button class="hero-cta-primary">
          {{ 'HOME.CTA_REGISTER' | translate }}
        </a>
        <a routerLink="/auth/login" mat-stroked-button class="hero-cta-secondary">
          {{ 'HOME.CTA_LOGIN' | translate }}
        </a>
      }
    </div>
  </div>
</div>
