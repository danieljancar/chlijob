<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
    <p class="auth-subtitle">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'AUTH.LOGIN.EMAIL' | translate }}</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'AUTH.LOGIN.PASSWORD' | translate }}</mat-label>
        <input
          matInput
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button mat-icon-button matSuffix type="button" (click)="showPassword.set(!showPassword())">
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <button
        mat-flat-button
        class="full-width submit-btn"
        type="submit"
        [disabled]="loading() || form.invalid"
      >
        {{ loading() ? ('AUTH.LOGIN.LOADING' | translate) : ('AUTH.LOGIN.SUBMIT' | translate) }}
      </button>
    </form>

    <p class="auth-link">
      {{ 'AUTH.LOGIN.REGISTER_HINT' | translate }}
      <a routerLink="/auth/register">{{ 'AUTH.REGISTER.TITLE' | translate }}</a>
    </p>
  </div>
</div>
